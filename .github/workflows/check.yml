name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Only the lead may change contracts/, api/, generated types and CI
        if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'FreidhYMorales'
        run: |
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" \
            | grep -E '^(contracts/|api/|web/src/contracts/|\.github/)'; then
            echo "::error::These files belong to the lead (see AGENTS.md). Undo them with: git restore --source origin/main <file>"
            exit 1
          fi

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: uv sync --locked
      - run: npm --prefix web ci
      - run: make check

      - name: Generated contracts are up to date
        run: |
          uv run --package contracts python -m contracts.export
          npm --prefix web run contracts
          git diff --exit-code contracts/schema web/src/contracts || {
            echo "::error::Schema or TS types drifted. Run the export and 'npm --prefix web run contracts', then commit."
            exit 1
          }
