name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Only the lead may change contracts/
        if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'FreidhYMorales'
        run: |
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -E '^contracts/'; then
            echo "::error::contracts/ is frozen; only the lead may change it."
            exit 1
          fi

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: uv sync --locked
      - run: npm --prefix web ci
      - run: make check
