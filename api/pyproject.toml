[project]
name = "api"
version = "0.1.0"
description = "FastAPI service: DuckDB over Parquet plus the engine, returning contract models"
requires-python = ">=3.13,<3.14"
dependencies = [
    "contracts",
    "engine",
    "duckdb>=2.0.0",
    "fastapi[standard]>=0.162.7",
]

[tool.uv.sources]
contracts = { workspace = true }
engine = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api"]
