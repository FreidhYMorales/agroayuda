[project]
name = "contracts"
version = "0.1.0"
description = "Pydantic models shared by every module (single source of truth)"
requires-python = ">=3.13,<3.14"
dependencies = ["pydantic>=2.14.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/contracts"]
