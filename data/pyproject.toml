[project]
name = "data-pipeline"
version = "0.1.0"
description = "Offline pipeline: NASA POWER, SoilGrids and the crop catalog to Parquet and static files"
requires-python = ">=3.13,<3.14"
dependencies = [
    "contracts",
    "engine",
    "duckdb>=2.0.0",
    "earthaccess>=0.19.0",
    "httpx>=0.28.1",
    "pandas>=3.1.1",
    "rioxarray>=0.24.0",
    "xarray>=2026.9.0",
]

[tool.uv.sources]
contracts = { workspace = true }
engine = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/data_pipeline"]
