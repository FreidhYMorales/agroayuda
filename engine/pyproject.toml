[project]
name = "engine"
version = "0.1.0"
description = "Pure rotation rules, site risks and scoring (no I/O)"
requires-python = ">=3.13,<3.14"
dependencies = ["contracts"]

[tool.uv.sources]
contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/engine"]
