[project]
name = "agroayuda"
version = "0.1.0"
description = "AgroAyuda: crop rotation decision support for Guatemala's Dry Corridor (NASA Space Apps 2026)"
requires-python = ">=3.13,<3.14"
dependencies = ["api", "contracts", "data-pipeline", "engine"]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["contracts", "data", "engine", "api"]

[tool.uv.sources]
contracts = { workspace = true }
data-pipeline = { workspace = true }
engine = { workspace = true }
api = { workspace = true }

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["web", "docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["api", "contracts", "data_pipeline", "engine"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = ["contracts/src", "data/src", "engine/src", "api/src"]
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["rioxarray.*", "earthaccess.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
# Default (prepend) import mode: test file names must be unique across modules,
# e.g. engine/tests/test_engine_scoring.py. `importlib` mode would let the module
# folders (api/, engine/) shadow the installed packages of the same name.
addopts = ["-q"]
testpaths = ["contracts/tests", "data/tests", "engine/tests", "api/tests"]
